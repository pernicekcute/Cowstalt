name: Cowstalt
options:
  bundleIdPrefix: com.cowstalt
targets:
  Cowstalt:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt
    resources:
      - Cowstalt/Settings.bundle
    info:
      path: Cowstalt/Info.plist
      properties:
        CFBundleIdentifier: com.cowstalt.app
        CFBundleName: Cowstalt
        CFBundleDisplayName: Cowstalt
        CFBundleExecutable: Cowstalt
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Keep this clean and simple for pure SwiftUI:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app
      ASSETCATALOG_COMPILER_APPICON_NAME: icon
