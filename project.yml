name: Cowstalt
options:
  bundleIdPrefix: com.cowstalt
targets:
  Cowstalt:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt
    resources:
      - path: Cowstalt/Settings.bundle
    info:
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Cowstalt"
        CFBundleName: "Cowstalt"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app
      ASSETCATALOG_COMPILER_APPICON_NAME: icon
