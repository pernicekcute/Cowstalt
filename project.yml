name: Cowstalt
options:
  bundleIdPrefix: com.cowstalt
targets:
  Cowstalt:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt
    resources:
      - Cowstalt/Settings.bundle
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app
      ASSETCATALOG_COMPILER_APPICON_NAME: icon
      # Inject Info.plist keys directly to prevent parsing errors:
      INFOPLIST_KEY_UILaunchScreen: {}
      INFOPLIST_KEY_CFBundleDisplayName: "Cowstalt"
      INFOPLIST_KEY_CFBundleName: "Cowstalt"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
      INFOPLIST_KEY_CFBundleVersion: "1"
