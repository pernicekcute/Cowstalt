name: Cowstalt
options:
  bundleIdPrefix: com.cowstalt
targets:
  Cowstalt:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Cowstalt
    resources:
      - path: Cowstalt/Settings.bundle
    dependencies:
      - target: CowstaltWidget
        embed: true
    info:
      path: Cowstalt/Info.plist
      properties:
        CFBundleIdentifier: com.cowstalt.app
        CFBundleName: Cowstalt
        CFBundleDisplayName: Cowstalt
        CFBundleExecutable: Cowstalt
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app
      ASSETCATALOG_COMPILER_APPICON_NAME: icon

  CowstaltWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: CowstaltWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app.CowstaltWidget
      PRODUCT_NAME: CowstaltWidget
    info:
      path: CowstaltWidget/Info.plist
      properties:
        CFBundleDisplayName: CowstaltWidget
        CFBundleIdentifier: com.cowstalt.app.CowstaltWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
