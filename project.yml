name: Cowstalt
options:
  bundleIdPrefix: com.cowstalt
targets:
  Cowstalt:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt
        excludes:
          - CowstaltActivities
    dependencies:
      - target: CowstaltWidget
        embed: true
    info:
      properties:
        CFBundleIdentifier: com.cowstalt.app
        CFBundleName: Cowstalt
        CFBundleDisplayName: Cowstalt
        CFBundleExecutable: Cowstalt
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app
      ASSETCATALOG_COMPILER_APPICON_NAME: icon

  CowstaltWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt/CowstaltActivities
    info:
      properties:
        CFBundleIdentifier: com.cowstalt.app.widget
        CFBundleName: CowstaltWidget
        CFBundleDisplayName: CowstaltWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app.widget
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
