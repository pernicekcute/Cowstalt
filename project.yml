name: Cowstalt
options:
  bundleIdPrefix: com.cowstalt
targets:
  Cowstalt:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt
        excludes:
          - CowstaltActivities
    resources:
      - path: Cowstalt/Settings.bundle
    dependencies:
      - target: CowstaltActivities
        embed: true
    info:
      path: Cowstalt/Info.plist
      properties:
        CFBundleIdentifier: com.cowstalt.app
        CFBundleName: Cowstalt
        CFBundleDisplayName: Cowstalt
        CFBundleExecutable: Cowstalt
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app
      ASSETCATALOG_COMPILER_APPICON_NAME: icon

  CowstaltActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cowstalt/CowstaltActivities
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cowstalt.app.CowstaltActivities
      PRODUCT_NAME: CowstaltActivities
    info:
      path: Cowstalt/CowstaltActivities/Info.plist
      properties:
        CFBundleDisplayName: CowstaltActivities
        CFBundleIdentifier: com.cowstalt.app.CowstaltActivities
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
